name: Release Obsidian plugin

on:
    push:
        branches:
            - master
        tags:
            - '*'
        paths:
            - manifest.json

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build and test plugin
              run: |
                  npm ci
                  npm run validate
                  npm run build
                  npm run lint
                  npm test
                  python scripts/check-persian-coverage.py

            - name: Verify release version
              id: release
              shell: bash
              run: |
                  manifest_version="$(node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync('manifest.json', 'utf8')).version);")"
                  package_version="$(node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version);")"
                  versions_min_app="$(node -e "const fs = require('fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8')); console.log(versions[manifest.version] ?? '');")"
                  manifest_min_app="$(node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync('manifest.json', 'utf8')).minAppVersion);")"

                  if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$manifest_version" ]; then
                      echo "Release tag ($GITHUB_REF_NAME) must match manifest.json version ($manifest_version)."
                      exit 1
                  fi

                  if [ "$manifest_version" != "$package_version" ]; then
                      echo "manifest.json version ($manifest_version) must match package.json version ($package_version)."
                      exit 1
                  fi

                  if [ "$versions_min_app" != "$manifest_min_app" ]; then
                      echo "versions.json must map $manifest_version to minAppVersion $manifest_min_app."
                      exit 1
                  fi

                  echo "version=$manifest_version" >> "$GITHUB_OUTPUT"

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Build manual-install package
              shell: bash
              run: |
                  rm -rf dist-release
                  mkdir -p dist-release/trader-journal
                  cp main.js manifest.json dist-release/trader-journal/
                  if [ -f styles.css ]; then
                      cp styles.css dist-release/trader-journal/
                  fi
                  cd dist-release
                  zip -r "trader-journal-${{ steps.release.outputs.version }}.zip" trader-journal

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
                      dist-release/trader-journal-${{ steps.release.outputs.version }}.zip

            - name: Create or update release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_VERSION: ${{ steps.release.outputs.version }}
              shell: bash
              run: |
                  assets=(main.js manifest.json "dist-release/trader-journal-${RELEASE_VERSION}.zip")
                  if [ "${{ steps.styles.outputs.exists }}" = "true" ]; then
                      assets+=(styles.css)
                  fi

                  if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
                      gh release upload "$RELEASE_VERSION" "${assets[@]}" --clobber
                      exit 0
                  fi

                  notes_file="docs/RELEASE-${RELEASE_VERSION}-FA.md"
                  if [ -f "$notes_file" ]; then
                      gh release create "$RELEASE_VERSION" \
                        --target "$GITHUB_SHA" \
                        --title "$RELEASE_VERSION" \
                        --notes-file "$notes_file" \
                        "${assets[@]}"
                  else
                      gh release create "$RELEASE_VERSION" \
                        --target "$GITHUB_SHA" \
                        --title "$RELEASE_VERSION" \
                        --generate-notes \
                        "${assets[@]}"
                  fi
