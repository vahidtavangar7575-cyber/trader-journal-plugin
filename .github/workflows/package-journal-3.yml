name: Package Journal 3 Premium

on:
  push:
    branches:
      - feature/journal-3.0-premium
      - feature/journal-3.1-therapist-ux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build plugin
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "build_exit_code=$code" >> "$GITHUB_ENV"
          exit $code

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-3.1-build-diagnostics
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare installable plugin package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/trader-journal
          cp main.js manifest.json styles.css package/trader-journal/
          if [ -f docs/INSTALL-FA.md ]; then cp docs/INSTALL-FA.md package/trader-journal/INSTALL-FA.md; fi
          if [ -f docs/TRADE_THERAPIST_CORE_FA.md ]; then cp docs/TRADE_THERAPIST_CORE_FA.md package/trader-journal/TRADE_THERAPIST_CORE_FA.md; fi
          cat > package/trader-journal/JOURNAL-3-README-FA.txt <<'EOF'
          Trader Journal 3.1 Premium - Obsidian

          این بسته جایگزین مستقیم افزونه قبلی Trader Journal است.
          شناسه افزونه همچنان trader-journal باقی مانده است.

          نصب:
          1) Obsidian را کامل ببندید.
          2) پوشه trader-journal را داخل مسیر زیر جایگزین کنید:
             <Vault>/.obsidian/plugins/trader-journal/
          3) اگر قبلاً نسخه قدیمی نصب است، data.json فعلی خود را نگه دارید و حذف یا جایگزین نکنید.
          4) Obsidian را باز کنید و Trader Journal را یک بار Disable/Enable کنید.

          فایل های لازم برای اجرا:
          - main.js
          - manifest.json
          - styles.css

          Journal 3.1 شامل آیین تعهد روزانه بازطراحی‌شده و ژورنال حسی/شناختی کم‌اصطکاک است.
          data.json عمداً داخل این بسته قرار نگرفته تا حساب‌ها و تنظیمات قبلی شما پاک نشود.
          EOF
          test -s package/trader-journal/main.js
          test -s package/trader-journal/manifest.json
          test -s package/trader-journal/styles.css
          ls -lah package/trader-journal

      - name: Upload Journal 3.1 Premium replacement artifact
        uses: actions/upload-artifact@v4
        with:
          name: trader-journal-3.1.0-replacement
          path: package/trader-journal
          if-no-files-found: error
          retention-days: 30
