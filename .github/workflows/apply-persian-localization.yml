name: Apply Persian localization

on:
  push:
    branches:
      - feature/persian-rtl
    paths:
      - scripts/apply-persian-localization.py
      - scripts/fix-persian-i18n-keys.py
      - .github/workflows/apply-persian-localization.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/persian-rtl
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Persian patch
        run: |
          if ! grep -Fq "export type TraderJournalLanguage = 'en' | 'vi' | 'fa';" src/settings.ts; then
            python scripts/apply-persian-localization.py
          else
            echo "Base Persian localization already applied."
          fi
          python scripts/fix-persian-i18n-keys.py

      - name: Validate generated code
        run: |
          npm run build
          npm run lint
          npm test

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/settings.ts src/i18n.ts src/main.ts src/ui/SettingsTab.tsx styles.css docs/PERSIAN.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: add Persian localization and RTL support"
          git push origin HEAD:feature/persian-rtl
