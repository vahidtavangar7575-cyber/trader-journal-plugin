name: Complete Persian translations

on:
  push:
    branches:
      - feature/khan-wizard-final
    paths:
      - scripts/complete-persian-i18n.py
      - scripts/check-persian-coverage.py
      - .github/workflows/complete-persian-i18n.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/khan-wizard-final
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Complete Persian translations
        run: python scripts/complete-persian-i18n.py

      - name: Verify Persian coverage
        run: python scripts/check-persian-coverage.py

      - name: Install dependencies
        run: npm ci

      - name: Validate generated source
        run: |
          npm run validate
          npm run build
          npm run lint
          npm test

      - name: Commit completed translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n.ts
          if git diff --cached --quiet; then
            echo "No translation changes to commit."
            exit 0
          fi
          git commit -m "feat(i18n): complete Persian translation coverage"
          git push origin HEAD:feature/khan-wizard-final
